# Reports a CI result to SparkDiff, keyed by the commit the run is on,
# so it shows on the Spark that commit belongs to.
name: SparkDiff report
description: Report a CI result to SparkDiff, keyed by the commit, so it shows on the Spark that commit belongs to.
author: SparkDiff
branding:
  icon: check-circle
  color: green
inputs:
  token:
    description: The token of the agent you made for CI under Your account, Your agents, from the secret SPARKDIFF_TOKEN.
    required: true
  repo:
    description: The repository's name in SparkDiff.
    required: true
  status:
    description: success, failure, error, skipped or pending.
    required: true
  summary:
    description: One line saying what ran and what it said.
    required: false
    default: ""
  url:
    description: A link to the run. Empty means this workflow run's page.
    required: false
    default: ""
  sha:
    description: The commit the result is for. Empty means the commit this run is on.
    required: false
    default: ""
runs:
  using: docker
  image: docker://sparkdiff/report@sha256:d5e24f7b5f178f933dd12376c12b6d9d2c0e2625899cb0b039cbf958cd9a9d8a
  env:
    SPARK_TOKEN: ${{ inputs.token }}
  args:
    - --repo=${{ inputs.repo }}
    - --status=${{ inputs.status }}
    - --summary=${{ inputs.summary }}
    - --url=${{ inputs.url }}
    - --sha=${{ inputs.sha }}
    - --kind=test_run
